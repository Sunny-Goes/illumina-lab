[project]
name = "illumina-lab"
version = "0.0.1"
description = "Evaluation and experimentation harness for illumina — canary runs, facts, pluggable fitness."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
norecursedirs = ["vendor"]  # the engine's suite runs in the engine's env, never here
markers = [
    "live: tests that run real illumina beams through azimo (real tokens, real minutes) — run only with ILAB_LIVE_TESTS=1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"
